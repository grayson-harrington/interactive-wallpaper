<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Interactive Wallpaper</title>
  </head>
  <body>
    <div id="stages"></div>

    <div id="dm-credit" class="dm-credit" hidden></div>

    <div id="ui" class="ui" hidden>
      <select id="pick" aria-label="Wallpaper"></select>
      <button id="grid-btn" type="button" title="Choose a Daily Minimal piece" hidden>▦</button>
      <label class="cycle" title="Automatically switch to a random piece">
        <input id="cycle" type="checkbox" /> Auto-cycle
      </label>
      <select id="cycle-min" aria-label="Auto-cycle interval"></select>
    </div>

    <div id="dm-grid" class="dm-grid" hidden>
      <div class="dm-panel">
        <div class="dm-head">
          <h2>Daily Minimal</h2>
          <label class="cycle" title="Switch to a random Daily Minimal while one is showing">
            <input id="dm-cycle" type="checkbox" /> Auto-cycle Daily Minimals
          </label>
          <select id="dm-cycle-min" aria-label="Daily Minimal auto-cycle interval"></select>
        </div>
        <div class="grid"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
